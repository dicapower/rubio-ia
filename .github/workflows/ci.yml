name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Read-only by default: CI never needs to write to the repository.
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/rubio

  install:
    # Proves the one-line installers work on a clean machine, against the
    # latest published release.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          RUBIO_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/rubio" version
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:RUBIO_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          ./install.ps1
          & (Join-Path $env:RUBIO_INSTALL_DIR 'rubio.exe') version
